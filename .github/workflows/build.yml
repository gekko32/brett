name: Build Brett

# Baut das Systembrett-Image ghcr.io/gekko32/brett (Gerald, 18.10.2026).
# Vorlage: build-brett.yml aus Paddione/Bachelorprojekt. mentolder-prod prüft
# alle 20 Minuten, ob es ein neues :latest gibt, und rollt es dann aus.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-brett-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Prüfen, bauen und hochladen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Typen prüfen und Tests
        run: |
          npm ci
          npm run typecheck --if-present
          npm test
        env:
          MOCK_DB: 'true'

      - name: Kurz-SHA
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v5

      - name: Image bauen und hochladen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/gekko32/brett
          tags: |
            ghcr.io/gekko32/brett:sha-${{ steps.version.outputs.sha }}
            ghcr.io/gekko32/brett:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
