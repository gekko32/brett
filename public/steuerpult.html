<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steuerpult · Systembrett</title>
  <style>
    /* Steuerpult (Gerald 16.10.2026): eigenes Fenster neben dem Spielfeld. */
    :root {
      --bg: var(--brett-ink-900, #0e1116);
      --surface: var(--brett-surface, #161b22);
      --line: var(--brett-line-2, rgba(255,255,255,0.12));
      --fg: var(--brett-fg, #e6edf3);
      --muted: var(--brett-muted, #9aa4b2);
      --accent: var(--brass, #c8a96e);
      --danger: var(--brett-danger, #d06a5c);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.35 ui-sans-serif, system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; background: var(--bg);
      padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0 0 4px; font-size: 14px; letter-spacing: 0.04em; }
    .zeile { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .code { font-weight: 700; font-size: 15px; letter-spacing: 0.06em; }
    .status { font-size: 11px; color: var(--muted); }
    .status.warnung { color: var(--bg); background: var(--danger); padding: 4px 6px; border-radius: 6px; font-weight: 600; }
    main { padding: 8px 12px 24px; display: flex; flex-direction: column; gap: 10px; }
    details.block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 10px; }
    details.block > summary { cursor: pointer; font-weight: 600; padding: 4px 0 6px; }
    label.feld { display: flex; flex-direction: column; gap: 3px; margin: 6px 0; font-size: 12px; }
    .klein { font-size: 11px; color: var(--muted); }
    input[type=text], input[type=number], select {
      width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 7px; font: inherit; }
    button { background: var(--surface); color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primaer { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    button.warn { background: var(--danger); border-color: var(--danger); color: var(--bg); }
    button.aktiv { background: var(--accent); color: var(--bg); }
    .reihe { display: flex; gap: 6px; flex-wrap: wrap; }
    .raster3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .raster2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .ebene-titel { margin: 8px 0 3px; font-size: 11px; font-weight: 600; color: var(--muted);
      border-left: 3px solid transparent; padding-left: 6px; }
    .person { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      border-left: 3px solid transparent; margin: 2px 0; }
    .person.ausgewaehlt { outline: 2px solid var(--accent); }
    .person .punkt { font-size: 14px; width: 18px; text-align: center; }
    .person .jahre { margin-left: auto; color: var(--muted); font-size: 11px; }
    .leer { color: var(--muted); font-style: italic; padding: 4px 0; }
    .katalog details { margin: 3px 0; }
    .katalog summary { cursor: pointer; font-size: 12px; padding: 3px 6px; border-left: 3px solid transparent; }
    .katalog .raster2 button { text-align: left; font-size: 11.5px; border-left: 3px solid transparent; }
    .farben { display: flex; gap: 6px; flex-wrap: wrap; }
    .farbe { width: 24px; height: 24px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
    .farbe.aktiv { border-color: var(--fg); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .reiter { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 2px 0 8px; }
    .reiter button { flex: 1; font-size: 12px; padding: 5px 2px; border-radius: 6px 6px 0 0; border-bottom: none; }
    .bilder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0 8px; }
    .bilder button.bild { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px; font-size: 10px; line-height: 1.1; }
    .bilder img { width: 40px; height: 40px; object-fit: contain; background: var(--gesicht-grund, #e8e2d4); border-radius: 50%; }
    .bilder .ohne { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .chips button { font-size: 11px; padding: 3px 8px; border-radius: 12px; }
    .dreh { font-size: 18px; padding: 4px 14px; }
    .tipp { margin-top: 6px; font-size: 11px; color: var(--muted); }
    .mini { font-size: 11px; padding: 2px 7px; }
    /* Klient (pult-klient.ts, 06.11.2026) */
    .klient-aktuell { font-weight: 600; margin: 2px 0 4px; }
    .hinweis-box { border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; margin: 4px 0 8px; font-size: 12px; }
    details.unterblock { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 4px; }
    details.unterblock > summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 2px 0; }
    input[type=date] { background: var(--bg); color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 6px; font: inherit; color-scheme: dark; }
    /* Regiebuch (pult-regiebuch.ts, 06.11.2026) */
    textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 7px; font: inherit; resize: vertical; }
    .frage { display: flex; align-items: center; gap: 6px; justify-content: space-between;
      border-left: 3px solid var(--line); padding: 3px 6px; margin: 3px 0; font-size: 12px; }
    .frage.aktiv { border-left-color: var(--accent); background: rgba(200,169,110,0.12); }
    fieldset.schritt { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; padding: 4px 8px 8px; }
    fieldset.schritt legend { font-size: 11px; color: var(--muted); padding: 0 4px; }
    /* Möbel (pult-moebel.ts, 06.11.2026) */
    .moebel-zeile { display: flex; align-items: center; gap: 4px; margin: 3px 0; }
    .moebel-zeile .moebel-name { flex: 1; min-width: 0; font-size: 12px; }
    .moebel-zeile button { flex-shrink: 0; }
    .moebel-zeile input[type=number] { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 5px; font: inherit; }
    /* Navigationskugel (ui/nav-kugel.ts) */
    .navzeile { display: flex; gap: 12px; align-items: center; margin: 4px 0 6px; }
    .navzeile canvas { flex-shrink: 0; border-radius: 50%; }
    .navspalte { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .navregler { display: flex; flex-direction: column; gap: 1px; font-size: 11px; color: var(--muted); }
    .navregler input { width: 100%; accent-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="pult.title">Steuerpult</h1>
    <div class="zeile">
      <span class="code" id="pult-code">—</span>
      <button type="button" id="pult-link" data-i18n="session.copyLink">Einladungslink kopieren</button>
    </div>
    <div class="status" id="pult-status">…</div>
  </header>
  <main id="pult-main"></main>
  <script type="module" src="../src/client/steuerpult.ts"></script>
</body>
</html>
