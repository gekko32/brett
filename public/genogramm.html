<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Genogramm · Systembrett</title>
  <style>
    /* Genogramm (Gerald 16.10.2026): drittes Fenster neben Spielfeld und Steuerpult. */
    :root {
      --bg: var(--brett-ink-900, #0e1116);
      --surface: var(--brett-surface, #161b22);
      --line: var(--brett-line-2, rgba(255,255,255,0.12));
      --fg: var(--brett-fg, #e6edf3);
      --muted: var(--brett-muted, #9aa4b2);
      --accent: var(--brass, #c8a96e);
      --danger: var(--brett-danger, #d06a5c);
      --papier: var(--geno-papier, #f4f1ea);
      --tinte: var(--geno-tinte, #1f2630);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 13px/1.35 ui-sans-serif, system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 260px; height: 100vh; }
    header { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 12px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0 8px 0 0; font-size: 14px; }
    button, select, input { background: var(--surface); color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 9px; font: inherit; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.aktiv { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    button.warn { background: var(--danger); color: var(--bg); border-color: var(--danger); }
    .status { margin-left: auto; font-size: 11px; color: var(--muted); }
    .status.warnung { color: var(--bg); background: var(--danger); padding: 3px 6px; border-radius: 6px; }
    #flaeche { background: var(--papier); width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #flaeche.ziehen { cursor: grabbing; }
    aside { border-left: 1px solid var(--line); padding: 10px 12px; overflow-y: auto; }
    aside h2 { font-size: 13px; margin: 0 0 8px; }
    label.feld { display: flex; flex-direction: column; gap: 3px; margin: 6px 0; font-size: 12px; }
    label.feld input, label.feld select { width: 100%; }
    .reihe { display: flex; gap: 6px; }
    .klein { font-size: 11px; color: var(--muted); }
    .katalog { position: absolute; top: 46px; left: 12px; z-index: 5; width: 300px; max-height: 70vh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
    .katalog summary { cursor: pointer; padding: 3px 6px; border-left: 3px solid transparent; font-size: 12px; }
    .katalog .raster { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px 0; }
    .katalog .raster button { text-align: left; font-size: 11.5px; }
    .hinweis { position: absolute; bottom: 12px; left: 12px; background: var(--surface); color: var(--fg);
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
    /* Zeichnung */
    .p-form { stroke: var(--tinte); stroke-width: 2; }
    .p-name { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: var(--tinte); }
    .p-jahre { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #5a6270; }
    .linie { stroke: var(--tinte); stroke-width: 2; fill: none; }
    .gewaehlt .p-form { stroke: #c06a1a; stroke-width: 4; }
    .nicht-aufgestellt { opacity: 0.55; }
    .nicht-aufgestellt .p-form { stroke-dasharray: 5 4; }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="geno.title">Genogramm</h1>
    <button type="button" id="g-undo" title="Rückgängig (Strg+Z)">↶</button>
    <button type="button" id="g-redo" title="Wiederholen (Strg+Y)">↷</button>
    <button type="button" id="g-person">＋ Person</button>
    <span class="klein" data-i18n="geno.connect">Verbinden:</span>
    <select id="g-art"></select>
    <button type="button" id="g-verbinden" data-i18n="geno.connectStart">Verbinden starten</button>
    <button type="button" id="g-anordnen" data-i18n="geno.arrange">Anordnen</button>
    <button type="button" id="g-mehr" data-i18n="geno.multi">Mehrfach</button>
    <button type="button" id="g-einpassen" data-i18n="geno.fit">Alles zeigen</button>
    <button type="button" id="g-legende" data-i18n="geno.legend">Legende</button>
    <button type="button" id="g-svg" data-i18n="geno.exportSvg">Als SVG speichern</button>
    <button type="button" id="g-png" data-i18n="geno.exportPng">Als Bild (PNG)</button>
    <select id="g-pdf-format"><option value="a4">A4</option><option value="a3">A3</option></select>
    <button type="button" id="g-pdf" data-i18n="geno.exportPdf">Als PDF</button>
    <span class="status" id="g-status">…</span>
  </header>
  <svg id="flaeche" xmlns="http://www.w3.org/2000/svg"><g id="welt"></g></svg>
  <aside id="g-panel"></aside>
  <script type="module" src="../src/client/genogramm.ts"></script>
</body>
</html>
