<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vergleich · Systembrett</title>
  <style>
    /* Vergleichsfenster (Gerald 06.11.2026): zwei Aufstellungen nebeneinander. */
    :root {
      --bg: #0e1116; --surface: #161b22; --line: rgba(255,255,255,0.12);
      --fg: #e6edf3; --muted: #9aa4b2; --accent: #c8a96e; --moebel: #5b4a38;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.35 ui-sans-serif, system-ui, sans-serif; }
    header { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 15px; }
    .hinweis { color: var(--muted); font-size: 12px; margin-top: 2px; }
    #flaeche { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 14px; }
    @media (max-width: 760px) { #flaeche { grid-template-columns: 1fr; } }
    .spalte { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; }
    select { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 7px; font: inherit; margin-bottom: 8px; }
    svg.plan { width: 100%; aspect-ratio: 1; display: block; background: #12161d; border-radius: 8px; color: var(--fg); }
    svg.plan text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .leer { color: var(--muted); font-style: italic; padding: 40px 8px; text-align: center; }
    .notiz { margin-top: 8px; font-size: 12px; color: var(--fg); white-space: pre-wrap; }
    #fakten { padding: 0 14px 16px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="cmp.title">Aufstellungen vergleichen</h1>
    <div class="hinweis" data-i18n="cmp.hint">Gleicher Maßstab, Blick von oben. Der Strich an jeder Figur zeigt ihre Blickrichtung.</div>
  </header>
  <div id="flaeche"></div>
  <div id="fakten"></div>
  <script type="module" src="../src/client/vergleich.ts"></script>
</body>
</html>
